version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/html/
    overwrite: true
file_exists_behavior: OVERWRITE
branch_config:
    wip\/.*: ~
    main:
        deploymentGroupName: Git-Application
        deploymentGroupConfig:
            serviceRoleArn: arn:aws:iam::050752644275:role/CodeDeploy_Role